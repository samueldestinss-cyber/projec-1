<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#101126" />
  <title>Hello, World! — A little moment of magic</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap');
    :root { color-scheme: dark; font-family: 'DM Sans', sans-serif; }
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh; display: grid; place-items: center; overflow: hidden;
      color: #f8f6ff; background: #101126;
      background-image: radial-gradient(ellipse at 50% 42%, #242552 0%, #171832 38%, #101126 76%);
    }
    .orb { position: fixed; width: 26rem; aspect-ratio: 1; border-radius: 50%; filter: blur(90px); opacity: .26; pointer-events: none; animation: float 10s ease-in-out infinite alternate; }
    .orb.one { background: #7767ff; top: -12rem; left: -9rem; }
    .orb.two { background: #ff6fbd; bottom: -15rem; right: -7rem; animation-delay: -4s; }
    main { position: relative; width: min(90vw, 720px); padding: clamp(2rem, 7vw, 5rem); text-align: center; border: 1px solid rgba(255,255,255,.13); border-radius: 32px; background: linear-gradient(145deg, rgba(255,255,255,.095), rgba(255,255,255,.035)); box-shadow: 0 30px 100px rgba(0,0,0,.35), inset 0 1px rgba(255,255,255,.12); backdrop-filter: blur(18px); animation: rise .9s cubic-bezier(.2,.8,.2,1) both; }
    .sparkle { display: inline-grid; place-items: center; width: 56px; height: 56px; margin-bottom: 1.7rem; border: 1px solid rgba(255,255,255,.18); border-radius: 18px; background: linear-gradient(135deg, #8275ff, #d27af4); box-shadow: 0 10px 35px rgba(130,117,255,.35); font-size: 1.6rem; animation: twinkle 3s ease-in-out infinite; }
    .eyebrow { margin: 0 0 1rem; color: #bdb9f9; font-size: .75rem; font-weight: 700; letter-spacing: .22em; text-transform: uppercase; }
    h1 { margin: 0; font-family: 'Space Grotesk', sans-serif; font-size: clamp(3.8rem, 11vw, 7rem); line-height: .98; letter-spacing: -.075em; }
    h1 span { display: block; color: transparent; background: linear-gradient(100deg, #aaa3ff 4%, #fff 48%, #ffa9da 96%); background-clip: text; -webkit-background-clip: text; }
    .message { max-width: 440px; margin: 1.5rem auto 0; color: #c4c3d9; font-size: clamp(1rem, 2.6vw, 1.15rem); line-height: 1.75; }
    .divider { display: flex; align-items: center; gap: .8rem; max-width: 245px; margin: 2.2rem auto 1.3rem; color: #a7a2d4; font-size: .7rem; letter-spacing: .15em; text-transform: uppercase; }
    .divider::before, .divider::after { content: ''; height: 1px; flex: 1; background: linear-gradient(90deg, transparent, rgba(255,255,255,.28)); }
    .divider::after { transform: scaleX(-1); }
    .signoff { margin: 0; color: #9290ad; font-size: .9rem; }
    .signoff strong { color: #e1defc; font-weight: 600; }
    @keyframes rise { from { opacity: 0; transform: translateY(22px) scale(.98); } to { opacity: 1; transform: translateY(0) scale(1); } }
    @keyframes float { to { transform: translate(35px, 30px) scale(1.12); } }
    @keyframes twinkle { 50% { transform: rotate(8deg) scale(1.06); } }
    @media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation-duration: .01ms !important; animation-iteration-count: 1 !important; scroll-behavior: auto !important; } }
  </style>
</head>
<body>
  <div class="orb one" aria-hidden="true"></div>
  <div class="orb two" aria-hidden="true"></div>
  <main>
    <div class="sparkle" aria-hidden="true">✦</div>
    <p class="eyebrow">A little moment of magic</p>
    <h1>Hello,<span>World!</span></h1>
    <p class="message">A fresh page, a bright idea, and a whole world of possibilities. Here’s to whatever you dream up next.</p>
    <div class="divider">Nice to meet you</div>
    <p class="signoff">Made with <strong>curiosity</strong> ✨</p>
  </main>
</body>
</html>
